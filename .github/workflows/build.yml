name: Build

on:
  push:

permissions:
  id-token: write
  contents: write
  # autorelease fails the build without these two -- see CLAUDE.md.
  deployments: write
  artifact-metadata: write
  actions: read
  checks: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # fuse3 runs the real mount tests; bubblewrap sandboxes the dats suites.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq fuse3 bubblewrap
      # Native binaries, not the default fat APE: go-fuse needs syscall.Splice.
      - uses: wow-look-at-my/go-toolchain@v1
        with:
          os: linux,darwin,windows
          arch: amd64,arm64
